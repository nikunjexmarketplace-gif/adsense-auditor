<script>
      async function runAudit() {
        const url = document.getElementById('targetUrl').value.trim();
        if (!url) return alert('Please enter a valid URL');

        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        try {
          const res = await fetch('/.netlify/functions/audit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });
          const data = await res.json();
          document.getElementById('loader').style.display = 'none';

          if (!res.ok || data.error) {
            alert('Crawl Notice: ' + (data.error || 'Server unable to fetch page. Ensure the URL is publicly reachable and not blocking bots.'));
            return;
          }

          document.getElementById('results').style.display = 'block';
          const circle = document.getElementById('scoreCircle');
          const verdict = document.getElementById('verdict');
          const finalScore = data.score !== undefined ? data.score : 0;
          circle.innerText = finalScore + '%';
          document.getElementById('meta').innerText = `Response: ${data.responseTime || 0}ms | Target: ${data.url}`;

          if (finalScore >= 80) {
            circle.style.background = 'var(--google-green-light)';
            circle.style.color = 'var(--google-green)';
            verdict.innerText = 'High Approval Probability (Ready for AdSense)';
            verdict.style.color = 'var(--google-green)';
          } else {
            circle.style.background = 'var(--google-red-light)';
            circle.style.color = 'var(--google-red)';
            verdict.innerText = 'At Risk: Low-Value Content Detected';
            verdict.style.color = 'var(--google-red)';
          }

          const checksDiv = document.getElementById('checks');
          checksDiv.innerHTML = '';
          (data.checks || []).forEach(c => {
            const div = document.createElement('div');
            div.className = 'check-row';
            div.innerHTML = `
              <div>
                <div style="font-weight:500;">${c.name}</div>
                <div style="font-size:0.85rem; color:var(--text-secondary);">${c.message}</div>
              </div>
              <div class="pill ${c.pass ? 'pass' : 'fail'}">${c.pass ? 'PASS' : 'FAIL'} (+${c.points} pts)</div>
            `;
            checksDiv.appendChild(div);
          });
        } catch (err) {
          document.getElementById('loader').style.display = 'none';
          alert('Network Connection Error: ' + err.message);
        }
      }
    </script>
