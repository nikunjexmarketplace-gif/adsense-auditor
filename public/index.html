<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google AdSense Quality & Policy Review Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --adsense-blue: #1a73e8;
      --adsense-blue-hover: #1557b0;
      --adsense-light-blue: #e8f0fe;
      --google-green: #1e8e3e;
      --google-green-light: #e6f4ea;
      --google-red: #d93025;
      --google-red-light: #fce8e6;
      --border-color: #dadce0;
      --bg-page: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #202124;
      --text-secondary: #5f6368;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Google Sans', sans-serif; font-size: 1.2rem; font-weight: 500; }
    .badge { background: var(--adsense-light-blue); color: var(--adsense-blue); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; }
    main { max-width: 920px; margin: 30px auto; padding: 0 16px; }
    
    .tab-container {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 6px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--adsense-light-blue);
      color: var(--adsense-blue);
      border-color: var(--adsense-blue);
    }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(60,64,67,0.12); }
    .input-group { display: flex; gap: 10px; }
    input { flex: 1; padding: 13px 16px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--adsense-blue); }
    button.submit-btn { background: var(--adsense-blue); color: #fff; border: none; border-radius: 4px; padding: 0 26px; font-weight: 500; font-family: 'Google Sans'; font-size: 0.95rem; cursor: pointer; }
    button.submit-btn:hover { background: var(--adsense-blue-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #loader { display: none; text-align: center; padding: 25px; color: var(--text-secondary); font-size: 0.95rem; }
    .progress-bar-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 14px; display: none; }
    .progress-bar { height: 100%; width: 0%; background: var(--adsense-blue); transition: width 0.3s; }

    #singleResults, #domainResults { display: none; }
    .score-header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px; }
    .score-num { width: 75px; height: 75px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; font-family: 'Google Sans'; }
    .check-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-page); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 10px; }
    .pill { padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
    .pass { background: var(--google-green-light); color: var(--google-green); }
    .fail { background: var(--google-red-light); color: var(--google-red); }

    table.domain-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
    table.domain-table th { background: var(--bg-page); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-weight: 500; color: var(--text-secondary); }
    table.domain-table td { padding: 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 192 192"><path fill="#4285F4" d="M152 40H40c-6.6 0-12 5.4-12 12v88c0 6.6 5.4 12 12 12h112c6.6 0 12-5.4 12-12V52c0-6.6-5.4-12-12-12z"/><path fill="#FBBC04" d="M120 70H60v16h60V70z"/><path fill="#34A853" d="M132 98H60v16h72V98z"/><path fill="#EA4335" d="M100 126H60v16h40v-16z"/></svg>
      Google AdSense Quality Console
    </div>
    <span class="badge">Universal Mode v4.5</span>
  </header>

  <main>
    <div style="text-align:center; margin-bottom:24px;">
      <h1 style="font-family:'Google Sans'; margin:0 0 8px 0; font-size:1.8rem;">AdSense Eligibility Auditor</h1>
      <p style="color:var(--text-secondary); margin:0;">Audit single pages or review your entire site's published articles.</p>
    </div>

    <div class="tab-container">
      <button class="tab-btn active" id="singleTabBtn" onclick="switchMode('single')">Single Page Audit</button>
      <button class="tab-btn" id="domainTabBtn" onclick="switchMode('domain')">Entire Domain Audit</button>
    </div>

    <div class="card">
      <div class="input-group">
        <input type="url" id="targetInput" placeholder="https://hereistheanswers.com/article-slug/" required />
        <button class="submit-btn" id="runBtn" onclick="handleStart()">Inspect URL</button>
      </div>
      <div class="progress-bar-container" id="progContainer">
        <div class="progress-bar" id="progBar"></div>
      </div>
    </div>

    <div id="loader">Running crawler simulation...</div>

    <!-- Single Result -->
    <div id="singleResults" class="card">
      <div class="score-header">
        <div class="score-num" id="scoreCircle">0%</div>
        <div>
          <div id="verdict" style="font-size:1.15rem; font-weight:700; font-family:'Google Sans';"></div>
          <div id="meta" style="font-size:0.85rem; color:var(--text-secondary); margin-top:4px;"></div>
        </div>
      </div>
      <div id="checks"></div>
    </div>

    <!-- Domain Result -->
    <div id="domainResults" class="card">
      <div class="score-header">
        <div class="score-num" id="domainScoreCircle">0%</div>
        <div>
          <div id="domainVerdict" style="font-size:1.15rem; font-weight:700; font-family:'Google Sans';"></div>
          <div id="domainMeta" style="font-size:0.85rem; color:var(--text-secondary); margin-top:4px;"></div>
        </div>
      </div>
      <h3 style="font-family:'Google Sans'; margin:20px 0 10px 0; font-size:1.05rem;">Discovered Article Audit Log</h3>
      <div style="overflow-x: auto;">
        <table class="domain-table">
          <thead>
            <tr>
              <th>Audited Post URL</th>
              <th>Words</th>
              <th>Density</th>
              <th>Schema</th>
              <th>Score</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="domainTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let currentMode = 'single';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('singleTabBtn').classList.toggle('active', mode === 'single');
      document.getElementById('domainTabBtn').classList.toggle('active', mode === 'domain');
      
      const input = document.getElementById('targetInput');
      const btn = document.getElementById('runBtn');
      
      document.getElementById('singleResults').style.display = 'none';
      document.getElementById('domainResults').style.display = 'none';
      document.getElementById('loader').style.display = 'none';
      document.getElementById('progContainer').style.display = 'none';

      if (mode === 'single') {
        input.placeholder = 'https://hereistheanswers.com/article-slug/';
        btn.innerText = 'Inspect URL';
      } else {
        input.placeholder = 'https://hereistheanswers.com (or paste direct sitemap URL)';
        btn.innerText = 'Audit Entire Domain';
      }
    }

    async function fetchViaProxy(url) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];
      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 50) return text;
          }
        } catch (_) {}
      }
      throw new Error('Connection failed via proxy gateway.');
    }

    function evaluateHtml(html, url) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const currentDomain = new URL(url).hostname;

      let score = 0;
      const checks = [];
      function addCheck(name, pass, points, message) {
        if (pass) score += points;
        checks.push({ name, pass, points: pass ? points : 0, maxPoints: points, message });
      }

      const bodyClone = doc.body ? doc.body.cloneNode(true) : doc.createElement('div');
      bodyClone.querySelectorAll('script, style, noscript, nav, footer, header').forEach(el => el.remove());
      const cleanText = (bodyClone.innerText || bodyClone.textContent || '').replace(/\s+/g, ' ').trim();
      const wordCount = cleanText.split(' ').filter(w => w.length > 0).length;
      addCheck('Static Word Count', wordCount >= 900, 15, `${wordCount} words detected (Threshold: ≥900)`);

      const textRatio = Number(((cleanText.length / Math.max(html.length, 1)) * 100).toFixed(1));
      addCheck('Text-to-HTML Density', textRatio >= 10, 10, `${textRatio}% text density (Threshold: ≥10%)`);

      const codeBlocks = doc.querySelectorAll('pre, code, table').length;
      addCheck('Structured Elements', codeBlocks > 0, 10, `Found ${codeBlocks} structured element(s) (tables/code)`);

      let hasSchema = false;
      doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
        if (/Article|TechArticle|BlogPosting|WebPage/i.test(s.textContent)) hasSchema = true;
      });
      addCheck('JSON-LD Schema', hasSchema, 10, hasSchema ? 'Valid Article Schema found' : 'No Schema detected');

      const authorMeta = doc.querySelector('meta[name="author"]');
      const authorEl = doc.querySelector('[class*="author"], [rel="author"], [id*="author"]');
      const authorName = (authorMeta ? authorMeta.content : (authorEl ? authorEl.innerText : '')).trim();
      const hasAuthor = authorName.length > 2 && !/admin|editor|team/i.test(authorName);
      addCheck('Named Author Attribution', hasAuthor, 10, hasAuthor ? `Verified: ${authorName.slice(0, 25)}` : 'Anonymous or missing');

      const hasCitations = /References|Citations|Sources|Bibliography/i.test(cleanText);
      addCheck('Source Citations', hasCitations, 10, hasCitations ? 'Citations identified' : 'Missing bibliography section');

      let hasPrivacy = false, hasContact = false, hasAbout = false;
      let internalLinks = 0, subdirLink = false;

      doc.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href') || '';
        const txt = (a.innerText || '').toLowerCase();
        if (/privacy/i.test(txt) || /privacy/i.test(href)) hasPrivacy = true;
        if (/contact/i.test(txt) || /contact/i.test(href)) hasContact = true;
        if (/about/i.test(txt) || /about/i.test(href)) hasAbout = true;

        if (href.startsWith('/') || href.includes(currentDomain)) {
          internalLinks++;
          if (href.includes('/games/') || href.includes('/tools/') || href.includes('/quiz/')) {
            subdirLink = true;
          }
        }
      });

      addCheck('Mandatory Policy Pages', hasPrivacy && (hasContact || hasAbout), 10, `Privacy: ${hasPrivacy ? 'Pass' : 'No'} | About/Contact: ${hasContact || hasAbout ? 'Pass' : 'No'}`);
      addCheck('Internal Crawl Paths', internalLinks >= 3, 10, `${internalLinks} internal link(s) found`);
      addCheck('Subdirectory Proof-of-Work', subdirLink, 10, subdirLink ? 'Utility link detected' : 'No utility link identified');

      const hasViewport = doc.querySelector('meta[name="viewport"]') !== null;
      addCheck('Mobile Responsive', hasViewport, 5, hasViewport ? 'Responsive viewport configured' : 'Missing viewport');

      return { score, wordCount, textRatio, hasSchema, checks };
    }

    async function handleStart() {
      const val = document.getElementById('targetInput').value.trim();
      if (!val || !val.startsWith('http')) return alert('Please enter a valid URL starting with http:// or https://');

      if (currentMode === 'single') {
        runSingleAudit(val);
      } else {
        runDomainAudit(val);
      }
    }

    async function runSingleAudit(url) {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('loader').innerText = 'Auditing single URL...';
      document.getElementById('singleResults').style.display = 'none';

      const startTime = performance.now();
      try {
        const html = await fetchViaProxy(url);
        const latency = Math.round(performance.now() - startTime);
        const res = evaluateHtml(html, url);

        document.getElementById('loader').style.display = 'none';
        document.getElementById('singleResults').style.display = 'block';

        const circle = document.getElementById('scoreCircle');
        const verdict = document.getElementById('verdict');
        circle.innerText = res.score + '%';
        document.getElementById('meta').innerText = `Fetch Latency: ${latency}ms | Target: ${url}`;

        if (res.score >= 80) {
          circle.style.background = 'var(--google-green-light)';
          circle.style.color = 'var(--google-green)';
          verdict.innerText = 'POLICY READY: High AdSense Approval Probability';
          verdict.style.color = 'var(--google-green)';
        } else {
          circle.style.background = 'var(--google-red-light)';
          circle.style.color = 'var(--google-red)';
          verdict.innerText = 'HIGH RISK: Low-Value Content Flags Detected';
          verdict.style.color = 'var(--google-red)';
        }

        const checksDiv = document.getElementById('checks');
        checksDiv.innerHTML = '';
        res.checks.forEach(c => {
          const row = document.createElement('div');
          row.className = 'check-row';
          row.innerHTML = `
            <div>
              <div style="font-weight:500;">${c.name}</div>
              <div style="font-size:0.85rem; color:var(--text-secondary);">${c.message}</div>
            </div>
            <div class="pill ${c.pass ? 'pass' : 'fail'}">${c.pass ? 'PASS' : 'FAIL'} (${c.points}/${c.maxPoints} pts)</div>
          `;
          checksDiv.appendChild(row);
        });
      } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert('Crawl error: ' + err.message);
      }
    }

    async function runDomainAudit(inputUrl) {
      const loader = document.getElementById('loader');
      const progContainer = document.getElementById('progContainer');
      const progBar = document.getElementById('progBar');
      const runBtn = document.getElementById('runBtn');

      loader.style.display = 'block';
      loader.innerText = 'Searching for sitemap and published articles...';
      progContainer.style.display = 'block';
      progBar.style.width = '10%';
      runBtn.disabled = true;
      document.getElementById('domainResults').style.display = 'none';

      const cleanRoot = inputUrl.replace(/\/$/, '');
      let discoveredUrls = [];

      // If user provided a direct sitemap link
      if (cleanRoot.endsWith('.xml')) {
        try {
          const xml = await fetchViaProxy(cleanRoot);
          discoveredUrls = parseLocUrls(xml, cleanRoot);
        } catch (_) {}
      }

      // If not, check all standard WordPress sitemap variations
      if (discoveredUrls.length === 0) {
        const paths = [
          `${cleanRoot}/sitemap_index.xml`,
          `${cleanRoot}/sitemap.xml`,
          `${cleanRoot}/wp-sitemap.xml`,
          `${cleanRoot}/post-sitemap.xml`,
          `${cleanRoot}/wp-sitemap-posts-post.1.xml`
        ];

        for (const p of paths) {
          try {
            const res = await fetchViaProxy(p);
            if (res && (res.includes('<urlset') || res.includes('<sitemapindex') || res.includes('<loc>'))) {
              // If it's a sitemap index, try to fetch the first sub-sitemap
              if (res.includes('<sitemapindex')) {
                const subMatch = res.match(/<loc>(.*?post.*?\.xml)<\/loc>/i) || res.match(/<loc>(.*?sitemap.*?\.xml)<\/loc>/i);
                if (subMatch && subMatch[1]) {
                  const subXml = await fetchViaProxy(subMatch[1]);
                  discoveredUrls = parseLocUrls(subXml, cleanRoot);
                  if (discoveredUrls.length > 0) break;
                }
              }
              discoveredUrls = parseLocUrls(res, cleanRoot);
              if (discoveredUrls.length > 0) break;
            }
          } catch (_) {}
        }
      }

      // Fallback: If sitemaps are blocked/missing, crawl the homepage to extract article links
      if (discoveredUrls.length === 0) {
        loader.innerText = 'Sitemap not exposed; reading articles from homepage...';
        try {
          const homeHtml = await fetchViaProxy(cleanRoot);
          const parser = new DOMParser();
          const doc = parser.parseFromString(homeHtml, 'text/html');
          const domainHost = new URL(cleanRoot).hostname;

          doc.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href') || '';
            if (href.startsWith('/') || href.includes(domainHost)) {
              let full = href.startsWith('/') ? `${cleanRoot}${href}` : href;
              full = full.split('#')[0].split('?')[0];
              if (
                full !== cleanRoot &&
                full !== `${cleanRoot}/` &&
                !full.match(/\/(category|tag|author|page|contact|privacy|about)\//i) &&
                !full.endsWith('.png') && !full.endsWith('.jpg') &&
                !discoveredUrls.includes(full)
              ) {
                discoveredUrls.push(full);
              }
            }
          });
        } catch (_) {}
      }

      function parseLocUrls(xmlStr, base) {
        const out = [];
        const matches = xmlStr.matchAll(/<loc>(https?:\/\/[^<]+)<\/loc>/g);
        for (const m of matches) {
          const u = m[1].trim();
          if (!u.endsWith('.xml') && !u.match(/\/(category|tag|author|page)\//) && u !== base && u !== base + '/') {
            out.push(u);
          }
        }
        return [...new Set(out)];
      }

      // Select up to 10 articles for audit
      const auditQueue = discoveredUrls.slice(0, 10);
      if (auditQueue.length === 0) {
        loader.style.display = 'none';
        progContainer.style.display = 'none';
        runBtn.disabled = false;
        return alert('Could not find published articles. You can also paste your exact sitemap URL (e.g. https://yourdomain.com/sitemap_index.xml) into the box.');
      }

      const tableBody = document.getElementById('domainTableBody');
      tableBody.innerHTML = '';
      let totalScore = 0;
      let completed = 0;

      for (const postUrl of auditQueue) {
        const slug = postUrl.split('/').filter(Boolean).pop() || postUrl;
        loader.innerText = `Crawling (${completed + 1}/${auditQueue.length}): ${slug.slice(0, 30)}...`;
        
        try {
          const html = await fetchViaProxy(postUrl);
          const res = evaluateHtml(html, postUrl);
          totalScore += res.score;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><a href="${postUrl}" target="_blank" class="truncate" style="color:var(--adsense-blue); text-decoration:none;">${postUrl}</a></td>
            <td>${res.wordCount}</td>
            <td>${res.textRatio}%</td>
            <td>${res.hasSchema ? 'Yes' : 'No'}</td>
            <td><strong>${res.score}%</strong></td>
            <td><span class="pill ${res.score >= 80 ? 'pass' : 'fail'}">${res.score >= 80 ? 'PASS' : 'RISK'}</span></td>
          `;
          tableBody.appendChild(tr);
        } catch (e) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="truncate" style="color:#666;">${postUrl}</span></td>
            <td colspan="4" style="color:var(--google-red);">Fetch blocked</td>
            <td><span class="pill fail">ERROR</span></td>
          `;
          tableBody.appendChild(tr);
        }

        completed++;
        progBar.style.width = Math.round((completed / auditQueue.length) * 100) + '%';
      }

      loader.style.display = 'none';
      progContainer.style.display = 'none';
      runBtn.disabled = false;
      document.getElementById('domainResults').style.display = 'block';

      const avgScore = Math.round(totalScore / auditQueue.length);
      const circle = document.getElementById('domainScoreCircle');
      const verdict = document.getElementById('domainVerdict');
      circle.innerText = avgScore + '%';
      document.getElementById('domainMeta').innerText = `Batch Size: ${auditQueue.length} articles analyzed across ${cleanRoot}`;

      if (avgScore >= 80) {
        circle.style.background = 'var(--google-green-light)';
        circle.style.color = 'var(--google-green)';
        verdict.innerText = 'PORTFOLIO READY: Whole Domain Qualifies for AdSense';
        verdict.style.color = 'var(--google-green)';
      } else {
        circle.style.background = 'var(--google-red-light)';
        circle.style.color = 'var(--google-red)';
        verdict.innerText = 'PORTFOLIO AT RISK: Optimize flagged pages below';
        verdict.style.color = 'var(--google-red)';
      }
    }
  </script>
</body>
</html>
